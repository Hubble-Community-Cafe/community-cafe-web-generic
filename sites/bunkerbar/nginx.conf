# The old bunkerbar.nl was a single index.php that switched its body on a ?body=
# query parameter. `rewrite` cannot match a query string, so the mapping is done with a
# `map`, which has to sit at http level and therefore above the server block.
#
# Unknown or absent body values fall through to "/", which is what index.php itself did:
# it rendered the "De bar" body for anything it did not recognise.
#
# Keep this in sync with redirects.txt; tools/smoke.sh asserts every line of it.
map $arg_body $legacy_body {
    default       "/";
    begin         "/";
    score         "/score";
    verenigingen  "/verenigingen";
    contact       "/contact";
    sitemap       "/sitemap";
    disclaimer    "/disclaimer";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Shared: clean URLs, caching, gzip, /health, 404, and the security headers
    # (included per location, see shared/nginx/README.md for why).
    include /etc/nginx/snippets/static-site.conf;

    location = /index.php {
        return 301 $legacy_body;
    }

    # Normalise any remaining trailing slash to the slashless clean URL.
    rewrite ^/(.+)/$ /$1 permanent;
}
