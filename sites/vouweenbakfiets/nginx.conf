# The old vouweenbakfiets.nl served a 202 byte <FRAMESET> pointing at
# vouweenbak.nl/bakfiets/. Only "/" and "/index.html" ever resolved, both with a 200,
# and both still do. Nothing moved, so redirects.txt is empty.
#
# Do NOT add `location = /index.html { return 301 /; }` to canonicalise: the shared
# `index index.html` directive makes "/" internally redirect to /index.html, which would
# re-enter that location and bounce back forever ("rewrite or internal redirection
# cycle"). Same trap as sites/heeftdaanzijnbacheloralgehaald.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Shared: clean URLs, caching, gzip, /health, 404, and the security headers
    # (included per location, see shared/nginx/README.md for why).
    include /etc/nginx/snippets/static-site.conf;

    # Normalise any remaining trailing slash to the slashless clean URL.
    rewrite ^/(.+)/$ /$1 permanent;
}
