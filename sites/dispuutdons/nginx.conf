# The old dispuutdons.nl was a single index.php on Plesk. Only two URLs ever resolved,
# "/" and "/index.php", so the redirect surface is small.
#
# Keep this in sync with redirects.txt; tools/smoke.sh asserts every line of it.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Shared: clean URLs, caching, gzip, /health, 404, and the security headers
    # (included per location, see shared/nginx/README.md for why).
    include /etc/nginx/snippets/static-site.conf;

    location = /index.php {
        return 301 /;
    }

    # Normalise any remaining trailing slash to the slashless clean URL.
    rewrite ^/(.+)/$ /$1 permanent;
}
