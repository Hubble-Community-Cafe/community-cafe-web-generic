# The old site was a plain static index.html on Plesk. Both "/" and "/index.html" served
# it with a 200; everything else already 404'd before the migration. The shared config's
# try_files handles both, so there is nothing to redirect and redirects.txt is empty.
#
# Note for future sites: do NOT add `location = /index.html { return 301 /; }` here to
# canonicalise. The shared `index index.html` directive makes "/" internally redirect to
# /index.html, which would re-enter that location and bounce back to "/" forever. nginx
# would fail the request with "rewrite or internal redirection cycle". Canonicalising an
# index file needs a $request_uri guard, and is not worth it for a one-page site.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Shared: clean URLs, caching, gzip, /health, 404, and the security headers
    # (included per location, see shared/nginx/README.md for why).
    include /etc/nginx/snippets/static-site.conf;

    # Normalise any remaining trailing slash to the slashless clean URL.
    rewrite ^/(.+)/$ /$1 permanent;
}
