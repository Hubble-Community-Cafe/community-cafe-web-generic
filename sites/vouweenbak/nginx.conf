# The old vouweenbak.nl was WordPress, so the legacy URL surface is large: the CMS
# routes (/wp-json, /feed, /wp-admin, /xmlrpc.php), the uploads tree, and a trailing
# slash on every single page URL.
#
# Two things about the ordering below, both deliberate:
#
#   1. The trailing-slash normaliser is a REGEX location, not the server-level
#      `rewrite` the other sites use. nginx runs server-level rewrites before it picks
#      a location, so a `rewrite` here would turn "/feed/" into a 301 to "/feed" and
#      only then redirect that to "/": two hops for every legacy URL. As a regex
#      location it loses to the `=` and `^~` locations below, so each legacy URL gets
#      exactly one 301.
#   2. `^~` on the prefix redirects is what makes them beat that regex location.
#
# Keep this in sync with redirects.txt; tools/smoke.sh asserts every line of it.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Shared: clean URLs, caching, gzip, /health, 404, and the security headers
    # (included per location, see shared/nginx/README.md for why).
    include /etc/nginx/snippets/static-site.conf;

    # ── Pages that did not come along ────────────────────────────────────────
    # The bakfiets page is now a site of its own.
    location = /bakfiets  { return 301 https://vouweenbakfiets.nl/; }
    location = /bakfiets/ { return 301 https://vouweenbakfiets.nl/; }

    # Six empty "vereniging" stubs, reachable only from the old sitemap. The duck
    # counts they were about live on /eendjes.
    location ^~ /vereniging { return 301 /eendjes; }

    # WordPress' own sample page, which rendered "Post Not Found" on the live site.
    location = /voorbeeld-pagina  { return 301 /; }
    location = /voorbeeld-pagina/ { return 301 /; }

    # ── WordPress plumbing ───────────────────────────────────────────────────
    location ^~ /wp-json     { return 301 /; }
    location ^~ /wp-admin    { return 301 /; }
    location ^~ /wp-includes { return 301 /; }
    location ^~ /author      { return 301 /; }
    location = /feed           { return 301 /; }
    location = /feed/          { return 301 /; }
    location = /comments/feed  { return 301 /; }
    location = /comments/feed/ { return 301 /; }
    location = /xmlrpc.php     { return 301 /; }
    location = /wp-login.php   { return 301 /; }

    location ^~ /wp-sitemap { return 301 /sitemap.xml; }

    # Uploads were served from a year/month tree. The files are flat under /img now,
    # and the names are unchanged, so the basename is all that is needed.
    location ^~ /wp-content/uploads {
        rewrite "^/wp-content/uploads/(?:[0-9]{4}/[0-9]{2}/)?(.+)$" /img/$1 permanent;
        return 301 /;
    }

    # Theme assets. Nothing outside the site ever linked to these.
    location ^~ /wp-content { return 301 /; }

    # Normalise any remaining trailing slash to the slashless clean URL. Every page
    # URL on the old site had one, so this is the redirect that carries the site.
    # The first character must be a plain path character: "/%5Cevil.com/" would otherwise
    # become "Location: /\evil.com", which browsers read as "//evil.com" (open redirect).
    location ~ ^/([A-Za-z0-9_-].*)/$ { return 301 /$1; }
}
