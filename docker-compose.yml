# Local development: every site in this repo, each on its own port.
#
#   docker compose up --build -d              all sites
#   docker compose up --build -d bunkerbar    one site
#
# Every service builds the one root Dockerfile, naming its site with the SITE build arg.
# The published port must match that site's `port` in site.json: tools/smoke.sh derives
# its URL from site.json, so a mismatch here surfaces as a failed smoke test.
#
# read_only plus the two tmpfs mounts match production: nginx can write its cache and pid
# file and nothing else, so the served files cannot change while the container runs.
# uid 101 is the nginx user in nginx:alpine; the tmpfs mounts must belong to it.
#
# Add a new service by copying the block below. tools/new-site.sh prints the reminder.

services:
  bunkerbar:
    build:
      context: .
      args:
        SITE: bunkerbar
    ports:
      - "9820:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /run:uid=101,gid=101

  dispuutdons:
