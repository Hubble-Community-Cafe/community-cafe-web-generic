# Security headers, shared by every site in this repo.
#
# Included once at server level (static-site.conf), which covers redirects, /health and
# the dotfile 403, AND again inside every `location` block that sets an add_header of its
# own. nginx drops all inherited add_header directives in any location that declares its
# own, so the server-level copy silently disappears from exactly those responses. See
# README.md.
#
# The CSP has no 'unsafe-inline': these are hand-written static sites with their styles and
# scripts in files. If a change appears to need 'unsafe-inline', move the inline style or
# script into a file instead.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
