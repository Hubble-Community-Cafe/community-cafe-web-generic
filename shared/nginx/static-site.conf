# Everything every static site in this repo does the same way.
# Included from inside each site's `server` block, after `root` is set.

index index.html;
charset utf-8;

# Emit relative Location headers ("/score" rather than "http://127.0.0.1/score").
# These containers sit behind Nginx Proxy Manager, so nginx's own idea of the host and
# scheme is the internal one: an absolute redirect would leak the container host and
# downgrade an HTTPS request to HTTP. The browser resolves a relative Location against
# the original URL, which is what we want for every legacy redirect.
absolute_redirect off;

# "Server: nginx", not "Server: nginx/1.31.8", and no version on nginx's own error pages.
server_tokens off;

# Security headers for every response that no location below sets headers for: the legacy
# 301s (server-level rewrites and the redirect-only locations in a site's nginx.conf), the
# 403 on a dotfile, and /health. Every location that adds a header of its own (Cache-Control)
# loses these and includes headers.conf again itself. See README.md.
include /etc/nginx/snippets/headers.conf;

# Clean URLs: /score serves score.html. Sites are authored as flat .html files, so this
# keeps the public URLs extensionless without a build step or a rewrite per page.
#
# $uri/index.html rather than $uri/: a bare "$uri/" makes nginx answer a directory
# without its slash ("/css") with a 301 to "/css/", which every site's trailing-slash
# normaliser sends straight back to "/css". A directory with no index.html is a 404.
location / {
    try_files $uri $uri.html $uri/index.html =404;
    # HTML is never cached, so a redeploy is visible immediately. Fingerprinting static
    # assets is not worth a build step here; they are cached for an hour instead (below).
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/headers.conf;
}

# Hide the dotfiles that a mirror of an old site tends to drag along.
#
# This MUST stay the first regex location. nginx tries regex locations in the order they
# appear and takes the first match, so below the asset block "/.git/x.css" would match
# that block instead and be served.
location ~ /\. {
    deny all;
}

# Static assets. Not content-hashed (no build step), so this is a moderate cache with
# revalidation rather than the year-long immutable cache a fingerprinted asset would get.
# One Cache-Control header carrying max-age, not `expires`: `expires` emits a Cache-Control
# of its own, and two of them is a conflict each cache may resolve differently.
location ~* \.(css|js|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot|pdf)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    include /etc/nginx/snippets/headers.conf;
}

# Container health check. Not logged, since Docker polls it constantly.
location = /health {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
}

# Browsers, feed readers and crawlers ask for /favicon.ico whether or not a page links an
# icon. Serve the site's own public/favicon.ico when it has one; a site without one answers
# an empty 204 rather than rendering its 404 page for every visitor. An exact match, so it
# wins over the asset block above and needs that block's headers repeated here.
location = /favicon.ico {
    try_files /favicon.ico =204;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    include /etc/nginx/snippets/headers.conf;
}

error_page 404 /404.html;
location = /404.html {
    internal;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/headers.conf;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;
