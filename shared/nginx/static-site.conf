# Everything every static site in this repo does the same way.
# Included from inside each site's `server` block, after `root` is set.

index index.html;
charset utf-8;

# Emit relative Location headers ("/score" rather than "http://127.0.0.1/score").
# These containers sit behind Nginx Proxy Manager, so nginx's own idea of the host and
# scheme is the internal one: an absolute redirect would leak the container host and
# downgrade an HTTPS request to HTTP. The browser resolves a relative Location against
# the original URL, which is what we want for every legacy redirect.
absolute_redirect off;

# Clean URLs: /score serves score.html. Sites are authored as flat .html files, so this
# keeps the public URLs extensionless without a build step or a rewrite per page.
location / {
    try_files $uri $uri.html $uri/ =404;
    # HTML is never cached, so a redeploy is visible immediately. Fingerprinting static
    # assets is not worth a build step here; they are cached for an hour instead (below).
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/headers.conf;
}

# Static assets. Not content-hashed (no build step), so this is a moderate cache with
# revalidation rather than the year-long immutable cache a fingerprinted asset would get.
location ~* \.(css|js|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot|pdf)$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate" always;
    include /etc/nginx/snippets/headers.conf;
}

# Container health check. Not logged, since Docker polls it constantly.
location = /health {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
}

# Hide the dotfiles that a mirror of an old site tends to drag along.
location ~ /\. {
    deny all;
}

error_page 404 /404.html;
location = /404.html {
    internal;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/headers.conf;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;
